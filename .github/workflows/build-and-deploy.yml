name: Build and deploy

on:
  # Rebuild whenever something is pushed
  push:
    branches: [main]

  # Rebuild every morning so that posts dated today become visible.
  # Jekyll leaves future-dated posts out of the build, so a post only
  # appears once a build runs on or after its date.
  # 07:00 UTC = 08:00 BST in summer, 07:00 GMT in winter.
  # GitHub often runs scheduled jobs late, so don't expect it on the dot.
  schedule:
    - cron: '0 7 * * *'

  # Lets you trigger a build by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # The Hydeout theme gemspec asks for bundler ~> 2.1
          bundler: '2.7.2'

      - name: Install gems
        run: bundle install

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          JEKYLL_ENV: production

      # A YAML error in front matter does NOT fail a Jekyll build. Jekyll
      # reports it, throws the whole front matter block away, and renders the
      # file anyway, so published: false is ignored and the draft goes live at
      # a mangled URL with no layout. Catch it here instead.
      - name: Fail if any front matter did not parse
        run: |
          if grep -q "YAML Exception" "$RUNNER_TEMP/build.log"; then
            echo "::error::Front matter failed to parse. Jekyll ignored it, so this file would publish regardless of published: false."
            grep "YAML Exception" "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
